version: "3.9"

services:
  kds-backend:
    build: ./backend            # Dockerfile is inside backend/
    container_name: kds-backend
    ports:
      - "3001:3001"            # Updated port
    env_file:
      - ./backend/.env         # Load all environment variables from your .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kds-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
