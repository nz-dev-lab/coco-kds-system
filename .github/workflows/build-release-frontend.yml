name: Build and Release KDS Frontend

on:
  push:
    tags:
      - 'frontend-v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build React application
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
      
      - name: Build Electron application
        working-directory: ./frontend
        run: npm run electron:build
      
      - name: List release files (Unix)
        if: runner.os != 'Windows'
        working-directory: ./frontend
        run: ls -lah release/
      
      - name: List release files (Windows)
        if: runner.os == 'Windows'
        working-directory: ./frontend
        run: dir release\
        shell: cmd
      
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kds-windows-latest
          path: |
            frontend/release/*.exe
            frontend/release/*.blockmap
            frontend/release/latest*.yml
          if-no-files-found: ignore
      
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kds-macos-latest
          path: |
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/latest*.yml
          if-no-files-found: ignore
      
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kds-ubuntu-latest
          path: |
            frontend/release/*.AppImage
            frontend/release/latest*.yml
          if-no-files-found: ignore
  
  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout public releases repo
        uses: actions/checkout@v4
        with:
          repository: nz-dev-lab/coco-kds-releases
          token: ${{ secrets.RELEASES_PAT }}
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create and push tag to public repo
        run: |
          git tag -f ${{ github.ref_name }}
          git push -f origin ${{ github.ref_name }}
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure
        run: ls -R artifacts
      
      - name: Create GitHub Release in PUBLIC repo
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          repository: nz-dev-lab/coco-kds-releases
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}