name: Deploy KDS Backend to Production

on:
  push:
    branches:
      - backend-production
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-production.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3
      
      - name: 🚀 Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/*"
          target: "/var/www/kds-api/"
          strip_components: 0
          overwrite: true
          
      - name: 🐳 Rebuild Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🐳 Rebuilding Docker container..."
            cd /var/www/kds-api/backend
            sudo docker-compose down
            sudo docker-compose up -d --build
            sudo docker image prune -af
            echo "✅ Deployment complete!"
            
      - name: 🏥 Health Check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 10
            if sudo docker ps | grep -q kds-backend; then
              echo "✅ Container is running"
            else
              echo "❌ Container failed"
              exit 1
            fi
            sudo docker logs kds-backend --tail 20